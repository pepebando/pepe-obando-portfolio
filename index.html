<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #040816;
      --purple: #7B2FBE;
      --purple-light: #A855F7;
      --teal: #06B6D4;
      --blue: #2563EB;
      --text: #F1F5F9;
      --muted: #64748B;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* ── Stars canvas ── */
    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Desktop nav ── */
    #desktop-nav {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 52px;
      background: linear-gradient(to bottom, rgba(4,8,22,.92) 0%, transparent 100%);
      backdrop-filter: blur(6px);
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      color: var(--text);
    }

    .logo-vr {
      font-size: 26px;
      font-weight: 800;
      color: var(--purple-light);
      letter-spacing: -1px;
    }

    .logo-sep {
      color: rgba(255,255,255,.2);
      font-weight: 300;
      font-size: 20px;
      margin: 0 6px;
      align-self: center;
    }

    .logo-name {
      font-size: 15px;
      font-weight: 400;
      color: rgba(241,245,249,.65);
      align-self: center;
    }

    .contact-row {
      display: flex;
      gap: 22px;
      align-items: center;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      opacity: .75;
      transition: opacity .2s, color .2s;
      white-space: nowrap;
    }

    .contact-link:hover { opacity: 1; color: var(--purple-light); }

    .contact-link svg { width: 17px; height: 17px; flex-shrink: 0; }

    /* ── Hero ── */
    #hero {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 1;
    }

    /* Central nebula glow */
    #hero::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -55%);
      width: 700px; height: 500px;
      background: radial-gradient(ellipse, rgba(88, 28, 180, .22) 0%, transparent 65%);
      pointer-events: none;
    }

    /* Orbital ellipses */
    .orbit {
      position: absolute;
      top: 50%; left: 50%;
      border-radius: 50%;
      border: 1px solid rgba(120, 60, 220, .18);
      pointer-events: none;
    }

    .orbit-1 {
      width: 640px; height: 180px;
      transform: translate(-50%, -50%) rotateX(0deg);
      margin-top: 40px;
    }

    .orbit-2 {
      width: 820px; height: 220px;
      transform: translate(-50%, -50%);
      margin-top: 60px;
      border-color: rgba(80, 40, 180, .10);
    }

    /* Platform glow */
    .platform-glow {
      position: absolute;
      bottom: 30%;
      left: 50%;
      transform: translateX(-50%);
      width: 340px; height: 28px;
      background: radial-gradient(ellipse, rgba(100, 40, 220, .55) 0%, transparent 70%);
      filter: blur(6px);
      pointer-events: none;
    }

    /* Decorative floating dots */
    .dot-deco {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(180, 100, 255, .6), transparent 70%);
      animation: floatDot 6s ease-in-out infinite;
    }

    @keyframes floatDot {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    /* 3D canvas */
    #quest-canvas {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -52%);
      width: 560px; height: 440px;
      z-index: 2;
    }

    /* Loading spinner over canvas */
    #model-loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -52%);
      width: 80px; height: 80px;
      z-index: 3;
      border: 3px solid rgba(160, 80, 255, .2);
      border-top-color: var(--purple-light);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: translate(-50%, -52%) rotate(360deg); } }

    /* ── Bubbles ── */
    .bubble {
      position: absolute;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      z-index: 10;
      text-align: center;
      transition: transform .25s, box-shadow .25s;
      user-select: none;
      padding: 12px;
    }

    .bubble:hover {
      transform: scale(1.1) !important;
    }

    .bubble.active .bubble-ring {
      opacity: 1;
      transform: scale(1.15);
    }

    /* Ring decoration on active */
    .bubble-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid currentColor;
      opacity: 0;
      transition: opacity .3s, transform .3s;
      pointer-events: none;
    }

    .bubble-icon {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
    }

    .bubble-icon svg { width: 100%; height: 100%; }

    .bubble-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .6px;
      line-height: 1.3;
    }

    /* Purple variant */
    .bbl-purple {
      width: 130px; height: 130px;
      background: radial-gradient(circle at 35% 30%, rgba(200, 100, 255, .55), rgba(70, 10, 150, .88));
      border: 1px solid rgba(200, 100, 255, .35);
      box-shadow: 0 0 28px rgba(120, 40, 210, .45), inset 0 0 30px rgba(200, 100, 255, .08);
      color: #D8B4FE;
    }

    /* Blue variant */
    .bbl-blue {
      width: 130px; height: 130px;
      background: radial-gradient(circle at 35% 30%, rgba(80, 150, 255, .55), rgba(20, 50, 150, .88));
      border: 1px solid rgba(80, 150, 255, .35);
      box-shadow: 0 0 28px rgba(37, 99, 235, .45), inset 0 0 30px rgba(80, 150, 255, .08);
      color: #93C5FD;
    }

    /* Teal variant */
    .bbl-teal {
      width: 130px; height: 130px;
      background: radial-gradient(circle at 35% 30%, rgba(20, 220, 220, .55), rgba(6, 80, 120, .88));
      border: 1px solid rgba(20, 220, 220, .35);
      box-shadow: 0 0 28px rgba(6, 182, 212, .45), inset 0 0 30px rgba(20, 220, 220, .08);
      color: #67E8F9;
    }

    /* Floating animations */
    @keyframes fa { 0%,100%{translate: 0 0} 50%{translate: -8px -12px} }
    @keyframes fb { 0%,100%{translate: 0 0} 50%{translate:  8px -10px} }
    @keyframes fc { 0%,100%{translate: 0 0} 50%{translate: -6px  10px} }
    @keyframes fd { 0%,100%{translate: 0 0} 50%{translate:  9px  12px} }

    /* Bubble positions — desktop */
    .bbl-video360        { left: 11%;  top: 18%; animation: fa 4.2s ease-in-out infinite; }
    .bbl-interactivos    { left: 3%;   top: 46%; animation: fb 5.0s ease-in-out infinite; }
    .bbl-mixta           { right: 8%;  top: 16%; animation: fc 4.7s ease-in-out infinite; }
    .bbl-recorridos      { right: 3%;  top: 48%; animation: fd 5.5s ease-in-out infinite; }

    /* ── "Select" hint ── */
    .select-hint {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      z-index: 10;
      white-space: nowrap;
    }

    .hint-arrow {
      display: block;
      margin-top: 4px;
      font-size: 20px;
      animation: bounce 1.8s ease-in-out infinite;
    }

    @keyframes bounce { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(8px)} }

    /* Mobile hero title */
    .mobile-hero-title {
      display: none;
      position: absolute;
      top: 90px;
      left: 0; right: 0;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .mobile-hero-title h1 {
      font-size: 22px;
      font-weight: 800;
    }

    .mobile-hero-title p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Gallery ── */
    #gallery {
      position: relative;
      z-index: 5;
      padding: 56px 52px 80px;
      min-height: 420px;
      display: none;
    }

    .gallery-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .gallery-header-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    .gallery-header-icon svg { width: 22px; height: 22px; }

    .gallery-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .8px;
    }

    /* Carousel */
    .carousel-outer {
      position: relative;
    }

    .carousel {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .carousel::-webkit-scrollbar { display: none; }

    .v-card {
      flex: 0 0 260px;
      scroll-snap-align: start;
      cursor: pointer;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      transition: transform .25s, border-color .25s;
    }

    .v-card:hover {
      transform: translateY(-5px);
      border-color: rgba(168, 85, 247, .4);
    }

    .v-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #080820;
    }

    .v-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.25);
      transition: background .2s;
    }

    .v-card:hover .play-overlay { background: rgba(0,0,0,.05); }

    .play-circle {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(0,0,0,.5);
      border: 2px solid rgba(255,255,255,.75);
      display: flex; align-items: center; justify-content: center;
    }

    .play-circle svg { width: 22px; height: 22px; margin-left: 3px; }

    .v-info {
      padding: 14px 14px 16px;
    }

    .v-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .v-cat {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .4px;
    }

    /* Carousel nav */
    .carousel-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .car-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      color: var(--text);
      font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .2s;
      line-height: 1;
    }

    .car-btn:hover { background: rgba(120, 60, 200, .4); }

    .car-dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .cdot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,.25);
      transition: background .2s, width .2s;
      cursor: pointer;
    }

    .cdot.on {
      background: var(--purple-light);
      width: 22px;
      border-radius: 4px;
    }

    /* ── Modal ── */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0,0,0,.92);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #modal.open { display: flex; }

    .modal-inner {
      position: relative;
      width: 100%;
      max-width: 960px;
    }

    .modal-close {
      position: absolute;
      top: -44px; right: 0;
      background: none;
      border: none;
      color: white;
      font-size: 30px;
      cursor: pointer;
      line-height: 1;
      opacity: .7;
      transition: opacity .2s;
    }

    .modal-close:hover { opacity: 1; }

    .modal-video-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    .modal-video-wrap iframe {
      width: 100%; height: 100%;
      display: block;
      border: none;
    }

    /* ── Mobile bottom nav ── */
    #mobile-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 200;
      background: rgba(4, 8, 22, .96);
      border-top: 1px solid rgba(255,255,255,.07);
      backdrop-filter: blur(12px);
    }

    .mnav-items {
      display: flex;
      justify-content: space-around;
      padding: 10px 0 24px;
    }

    .mnav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 500;
      transition: color .2s;
    }

    .mnav-item.active { color: var(--purple-light); }
    .mnav-item svg { width: 22px; height: 22px; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      #desktop-nav { padding: 16px 20px; }
      .contact-link span { display: none; }

      #mobile-nav { display: block; }
      body { padding-bottom: 80px; }

      #hero { height: 95vh; }

      .mobile-hero-title { display: block; }

      #quest-canvas {
        width: 300px; height: 260px;
        transform: translate(-50%, -40%);
      }

      #model-loading {
        transform: translate(-50%, -40%) rotate(0deg);
      }

      @keyframes spin { to { transform: translate(-50%, -40%) rotate(360deg); } }

      .bubble { width: 95px !important; height: 95px !important; gap: 4px; }
      .bubble-icon { width: 26px; height: 26px; }
      .bubble-label { font-size: 8.5px; }

      .bbl-video360     { left: 50%; top: 17%; transform: translateX(-50%) !important; animation: none !important; }
      .bbl-interactivos { left: 4%;  top: 42%; animation: fb 5s ease-in-out infinite; }
      .bbl-mixta        { right: 4%; top: 42%; animation: fc 4.7s ease-in-out infinite; }
      .bbl-recorridos   { left: 50%; top: 72%; transform: translateX(-50%) !important; animation: none !important; }

      .orbit-1 { width: 320px; height: 100px; }
      .orbit-2 { width: 400px; height: 120px; }
      .platform-glow { width: 200px; bottom: 24%; }

      .select-hint { bottom: 40px; font-size: 12px; }

      #gallery { padding: 40px 16px 60px; }
      .gallery-title { font-size: 18px; }

      .v-card { flex: 0 0 200px; }
    }
  </style>
</head>

<script type="module">

/* ── Stars ── */
(function initStars() {
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let pts = [];

  function resize() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    pts = Array.from({ length: 220 }, () => ({
      x: Math.random() * c.width,
      y: Math.random() * c.height,
      r: Math.random() * 1.4 + .2,
      phase: Math.random() * Math.PI * 2,
      speed: .006 + Math.random() * .01,
    }));
  }

  function draw(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    const g = ctx.createRadialGradient(c.width/2, c.height/2, 0, c.width/2, c.height/2, c.width * .9);
    g.addColorStop(0, '#0e0b2e');
    g.addColorStop(1, '#020510');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, c.width, c.height);
    pts.forEach(p => {
      const a = Math.abs(Math.sin(p.phase + t * p.speed));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(210,190,255,${a * .85})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  resize();
  requestAnimationFrame(draw);
  window.addEventListener('resize', resize);
})();

/* ── Three.js ── */
const canvas = document.getElementById('quest-canvas');
const isMobile = () => window.innerWidth <= 768;

function canvasSize() {
  return isMobile() ? { w: 300, h: 260 } : { w: 560, h: 440 };
}

const { w, h } = canvasSize();
canvas.width = w; canvas.height = h;
canvas.style.width = w + 'px'; canvas.style.height = h + 'px';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, w / h, .1, 100);
camera.position.set(0, .3, 5.5);

const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(w, h);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

// Lights
scene.add(new THREE.AmbientLight(0xffffff, .6));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
keyLight.position.set(4, 4, 5);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xA855F7, 1.2);
fillLight.position.set(-4, 1, 3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x06B6D4, .8);
rimLight.position.set(0, -3, -4);
scene.add(rimLight);

const pLight = new THREE.PointLight(0x7B2FBE, 3, 12);
pLight.position.set(-2, 2, 3);
scene.add(pLight);

// OrbitControls
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = .06;
controls.enableZoom = false;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minPolarAngle = Math.PI * .3;
controls.maxPolarAngle = Math.PI * .65;

// Load model
const loader = new GLTFLoader();
loader.load('MetaQuest3D/source/Quest3.glb', (gltf) => {
  document.getElementById('model-loading').style.display = 'none';
  const model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const scale = 2.4 / Math.max(size.x, size.y, size.z);
  model.scale.setScalar(scale);
  model.position.sub(center.multiplyScalar(scale));
  model.position.y -= .15;
  scene.add(model);
}, undefined, () => {
  document.getElementById('model-loading').style.display = 'none';
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const s = canvasSize();
  canvas.width = s.w; canvas.height = s.h;
  canvas.style.width = s.w + 'px'; canvas.style.height = s.h + 'px';
  camera.aspect = s.w / s.h;
  camera.updateProjectionMatrix();
  renderer.setSize(s.w, s.h);
});

/* ── Select category ── */
window.selectCat = function(id) {
  const cat = CATS[id];
  if (!cat) return;

  // active bubble
  document.querySelectorAll('.bubble').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-cat="${id}"]`).classList.add('active');

  // gallery header
  document.getElementById('gal-title').textContent = cat.name;
  document.getElementById('gal-title').style.color = cat.color;
  const iconWrap = document.getElementById('gal-icon-wrap');
  iconWrap.style.background = cat.color + '22';
  iconWrap.style.border = `1px solid ${cat.color}44`;
  const iconEl = document.getElementById('gal-icon');
  iconEl.innerHTML = `<path d="${cat.iconPath}" stroke="${cat.color}" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;

  // cards
  const carousel = document.getElementById('carousel');
  carousel.innerHTML = '';
  cat.videos.forEach((v) => {
    const card = document.createElement('div');
    card.className = 'v-card';
    const thumb = `https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg`;
    card.innerHTML = `
      <div class="v-thumb">
        <img src="${thumb}" alt="${v.title}" loading="lazy"
             onerror="this.style.opacity='.3'">
        <div class="play-overlay">
          <div class="play-circle">
            <svg viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>
          </div>
        </div>
      </div>
      <div class="v-info">
        <div class="v-title">${v.title}</div>
        <div class="v-cat" style="color:${cat.color}">${v.client} · ${cat.name}</div>
      </div>
    `;

    card.addEventListener('click', () => openModal(v.youtubeId));
    carousel.appendChild(card);
  });

  // dots
  const dotsEl = document.getElementById('car-dots');
  dotsEl.innerHTML = '';
  cat.videos.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'cdot' + (i === 0 ? ' on' : '');
    d.addEventListener('click', () => {
      carousel.scrollTo({ left: i * 280, behavior: 'smooth' });
    });
    dotsEl.appendChild(d);
  });

  const gal = document.getElementById('gallery');
  gal.style.display = 'block';
  setTimeout(() => gal.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
};

/* Carousel scroll → update dots */
document.getElementById('carousel').addEventListener('scroll', function() {
  const idx = Math.round(this.scrollLeft / 280);
  document.querySelectorAll('.cdot').forEach((d, i) => d.classList.toggle('on', i === idx));
});

window.carScroll = function(dir) {
  document.getElementById('carousel').scrollBy({ left: dir * 280, behavior: 'smooth' });
};

/* ── Modal ── */
window.openModal = function(youtubeId) {
  const modal = document.getElementById('modal');
  const iframe = document.getElementById('modal-iframe');
  iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0`;
  modal.classList.add('open');
};

window.closeModal = function() {
  const modal = document.getElementById('modal');
  const iframe = document.getElementById('modal-iframe');
  iframe.src = '';
  modal.classList.remove('open');
};

window.handleModalClick = function(e) {
  if (e.target === document.getElementById('modal')) closeModal();
};

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
