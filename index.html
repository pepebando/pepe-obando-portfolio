<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Projects · José Obando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    /* ── Tokens ── */
    :root {
      --bg:        #05090F;
      --surface:   #0B1220;
      --surface2:  #111C2E;
      --border:    rgba(255,255,255,0.07);
      --text:      #E8EEFF;
      --muted:     #5C6D88;
      --dim:       #2A3A52;

      --c360:  #8B5CF6;   /* violet   – VIDEO 360° */
      --cint:  #3B82F6;   /* blue     – INTERACTIVAS */
      --cmix:  #14B8A6;   /* teal     – REALIDAD MIXTA */
      --crec:  #F59E0B;   /* amber    – RECORRIDOS */

      --ease: cubic-bezier(.4,0,.2,1);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Stars ── */
    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ═══════════════════════════════════════
       NAV
    ═══════════════════════════════════════ */
    #nav {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      height: 64px;
      background: rgba(5,9,15,.88);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-mark {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -.5px;
      background: linear-gradient(135deg, #A78BFA 0%, #60A5FA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-divider {
      width: 1px;
      height: 16px;
      background: var(--dim);
    }

    .logo-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: .1px;
    }

    .nav-contact {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .nav-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.03);
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      transition: color .2s, border-color .2s, background .2s;
      white-space: nowrap;
    }

    .nav-pill svg { width: 14px; height: 14px; flex-shrink: 0; }

    .nav-pill:hover {
      color: var(--text);
      border-color: rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
    }

    .nav-pill span { }

    /* ═══════════════════════════════════════
       HERO
    ═══════════════════════════════════════ */
    #hero {
      position: relative;
      height: 100vh;
      min-height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 1;
    }

    /* Radial glow behind model */
    .hero-glow {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 700px; height: 500px;
      background: radial-gradient(ellipse,
        rgba(109,40,217,.18) 0%,
        rgba(59,130,246,.08) 45%,
        transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Hero title – sits above the model */
    .hero-title {
      position: absolute;
      top: 14%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 5;
      pointer-events: none;
      width: 90%;
    }

    .hero-title h1 {
      font-size: clamp(28px, 4.5vw, 52px);
      font-weight: 800;
      letter-spacing: -.5px;
      line-height: 1.1;
      background: linear-gradient(160deg, #fff 0%, rgba(167,139,250,.85) 60%, rgba(96,165,250,.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-title p {
      margin-top: 10px;
      font-size: clamp(13px, 1.5vw, 15px);
      color: var(--muted);
      font-weight: 400;
      letter-spacing: .3px;
    }

    /* Orbital decoration rings */
    .orbit {
      position: absolute;
      top: 50%; left: 50%;
      border-radius: 50%;
      border: 1px solid rgba(139,92,246,.12);
      pointer-events: none;
      z-index: 1;
    }
    .orbit-a { width: 580px; height: 160px; transform: translate(-50%,-50%); margin-top: 40px; }
    .orbit-b { width: 760px; height: 200px; transform: translate(-50%,-50%); margin-top: 60px; border-color: rgba(96,165,250,.07); }

    /* Platform glow */
    .platform-glow {
      position: absolute;
      bottom: 32%;
      left: 50%;
      transform: translateX(-50%);
      width: 320px; height: 24px;
      background: radial-gradient(ellipse, rgba(109,40,217,.55) 0%, transparent 70%);
      filter: blur(8px);
      pointer-events: none;
      z-index: 1;
    }

    /* Decorative floating particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(167,139,250,.7), transparent 70%);
      pointer-events: none;
      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      0%,100% { transform: translateY(0) scale(1); opacity: .6; }
      50% { transform: translateY(-16px) scale(1.1); opacity: 1; }
    }

    /* 3D canvas */
    #quest-canvas {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -48%);
      z-index: 2;
    }

    /* Loading spinner */
    #model-loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -48%);
      width: 64px; height: 64px;
      border: 2px solid rgba(139,92,246,.2);
      border-top-color: #A78BFA;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      z-index: 3;
    }
    @keyframes spin { to { transform: translate(-50%,-48%) rotate(360deg); } }

    /* Scroll indicator */
    .scroll-indicator {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 10;
      animation: fadeDown 2s ease-in-out infinite;
    }

    .scroll-indicator .line {
      width: 1px;
      height: 32px;
      background: linear-gradient(to bottom, transparent, var(--muted));
      animation: lineGrow 2s ease-in-out infinite;
    }

    @keyframes fadeDown {
      0%,100% { opacity: .4; transform: translateX(-50%) translateY(0); }
      50% { opacity: .9; transform: translateX(-50%) translateY(6px); }
    }

    @keyframes lineGrow {
      0%,100% { transform: scaleY(1); opacity: .4; }
      50% { transform: scaleY(1.4); opacity: .8; }
    }

    /* ═══════════════════════════════════════
       CATEGORIES SECTION
    ═══════════════════════════════════════ */
    #categories {
      position: relative;
      z-index: 5;
      padding: 64px 48px 0;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .cat-card {
      position: relative;
      padding: 24px 22px;
      border-radius: 18px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      transition: transform .25s var(--ease), border-color .25s, box-shadow .25s, background .25s;
      overflow: hidden;
      user-select: none;
    }

    /* Color tint background on hover/active */
    .cat-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0;
      transition: opacity .3s;
    }

    .cat-card[data-cat="video360"]::before  { background: radial-gradient(circle at 30% 30%, rgba(139,92,246,.25), transparent 65%); }
    .cat-card[data-cat="interactivos"]::before { background: radial-gradient(circle at 30% 30%, rgba(59,130,246,.25), transparent 65%); }
    .cat-card[data-cat="mixta"]::before    { background: radial-gradient(circle at 30% 30%, rgba(20,184,166,.25), transparent 65%); }
    .cat-card[data-cat="recorridos"]::before { background: radial-gradient(circle at 30% 30%, rgba(245,158,11,.25), transparent 65%); }

    .cat-card:hover { transform: translateY(-3px); }
    .cat-card:hover::before { opacity: .6; }

    .cat-card.active { transform: translateY(-4px); }
    .cat-card.active::before { opacity: 1; }

    .cat-card[data-cat="video360"].active  { border-color: rgba(139,92,246,.5);  box-shadow: 0 0 28px rgba(139,92,246,.18); }
    .cat-card[data-cat="interactivos"].active { border-color: rgba(59,130,246,.5);  box-shadow: 0 0 28px rgba(59,130,246,.18); }
    .cat-card[data-cat="mixta"].active    { border-color: rgba(20,184,166,.5);   box-shadow: 0 0 28px rgba(20,184,166,.18); }
    .cat-card[data-cat="recorridos"].active { border-color: rgba(245,158,11,.5);  box-shadow: 0 0 28px rgba(245,158,11,.18); }

    .cat-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .cat-icon svg { width: 22px; height: 22px; }

    .cat-card[data-cat="video360"] .cat-icon  { background: rgba(139,92,246,.15); color: #A78BFA; }
    .cat-card[data-cat="interactivos"] .cat-icon { background: rgba(59,130,246,.15); color: #93C5FD; }
    .cat-card[data-cat="mixta"] .cat-icon    { background: rgba(20,184,166,.15);  color: #5EEAD4; }
    .cat-card[data-cat="recorridos"] .cat-icon { background: rgba(245,158,11,.15); color: #FCD34D; }

    .cat-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .cat-card[data-cat="video360"] .cat-name  { color: #C4B5FD; }
    .cat-card[data-cat="interactivos"] .cat-name { color: #BAE6FD; }
    .cat-card[data-cat="mixta"] .cat-name    { color: #99F6E4; }
    .cat-card[data-cat="recorridos"] .cat-name { color: #FDE68A; }

    .cat-count {
      font-size: 12px;
      color: var(--muted);
      position: relative;
      z-index: 1;
      font-weight: 400;
    }

    /* Active indicator bar */
    .cat-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      border-radius: 0 0 18px 18px;
      transform: scaleX(0);
      transition: transform .3s var(--ease);
    }

    .cat-card[data-cat="video360"] .cat-bar  { background: #8B5CF6; }
    .cat-card[data-cat="interactivos"] .cat-bar { background: #3B82F6; }
    .cat-card[data-cat="mixta"] .cat-bar    { background: #14B8A6; }
    .cat-card[data-cat="recorridos"] .cat-bar { background: #F59E0B; }

    .cat-card.active .cat-bar { transform: scaleX(1); }

    /* ═══════════════════════════════════════
       VIDEO GRID
    ═══════════════════════════════════════ */
    #gallery {
      position: relative;
      z-index: 5;
      padding: 40px 48px 80px;
      display: none;
    }

    .gallery-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 28px;
    }

    .gallery-cat-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.2px;
    }

    .gallery-cat-count {
      font-size: 13px;
      color: var(--muted);
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }

    /* Card entrance animation */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .v-card {
      border-radius: 16px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform .3s var(--ease), border-color .3s, box-shadow .3s;
      animation: cardIn .4s var(--ease) backwards;
    }

    .v-card:hover { transform: translateY(-6px); }

    .v-card[data-cat="video360"]:hover  { border-color: rgba(139,92,246,.35); box-shadow: 0 16px 40px rgba(139,92,246,.12); }
    .v-card[data-cat="interactivos"]:hover { border-color: rgba(59,130,246,.35);  box-shadow: 0 16px 40px rgba(59,130,246,.12); }
    .v-card[data-cat="mixta"]:hover    { border-color: rgba(20,184,166,.35);   box-shadow: 0 16px 40px rgba(20,184,166,.12); }
    .v-card[data-cat="recorridos"]:hover { border-color: rgba(245,158,11,.35);  box-shadow: 0 16px 40px rgba(245,158,11,.12); }

    .v-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: var(--surface2);
    }

    .v-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s var(--ease), filter .4s;
      filter: brightness(.85);
    }

    .v-card:hover .v-thumb img {
      transform: scale(1.04);
      filter: brightness(1);
    }

    /* Play overlay */
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      border: 2px solid rgba(255,255,255,.65);
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
      transition: transform .2s, background .2s, border-color .2s;
    }

    .play-btn svg { width: 20px; height: 20px; margin-left: 3px; }

    .v-card:hover .play-btn {
      transform: scale(1.1);
      background: rgba(0,0,0,.75);
      border-color: rgba(255,255,255,.9);
    }

    /* Client badge */
    .client-badge {
      position: absolute;
      top: 10px; right: 10px;
      padding: 3px 10px;
      border-radius: 100px;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(6px);
      font-size: 10px;
      font-weight: 600;
      color: rgba(255,255,255,.8);
      letter-spacing: .3px;
      border: 1px solid rgba(255,255,255,.1);
    }

    .v-info {
      padding: 14px 16px 16px;
    }

    .v-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .v-meta {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: .2px;
    }

    /* ═══════════════════════════════════════
       MODAL
    ═══════════════════════════════════════ */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(3,6,15,.94);
      backdrop-filter: blur(12px);
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: modalIn .2s var(--ease);
    }

    #modal.open { display: flex; }

    @keyframes modalIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .modal-inner {
      position: relative;
      width: 100%;
      max-width: 980px;
      animation: modalScale .25s var(--ease);
    }

    @keyframes modalScale {
      from { transform: scale(.96); }
      to   { transform: scale(1); }
    }

    .modal-close {
      position: absolute;
      top: -48px; right: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: color .2s;
      font-family: inherit;
    }

    .modal-close:hover { color: var(--text); }

    .modal-close svg { width: 16px; height: 16px; }

    .modal-frame {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 40px 80px rgba(0,0,0,.6);
    }

    .modal-frame iframe {
      width: 100%; height: 100%;
      display: block;
      border: none;
    }

    /* ═══════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════ */
    @media (max-width: 900px) {
      .cat-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 640px) {
      #nav { padding: 0 20px; }
      .nav-pill span { display: none; }
      .logo-name { display: none; }

      #hero { min-height: 100svh; }

      .hero-title { top: 16%; }
      .hero-title h1 { font-size: 24px; }

      #quest-canvas {
        width: 290px !important; height: 250px !important;
        transform: translate(-50%, -44%) !important;
      }
      #model-loading {
        transform: translate(-50%, -44%) rotate(0) !important;
      }

      #categories { padding: 48px 20px 0; }
      .cat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .cat-card { padding: 18px 16px; }
      .cat-icon { width: 38px; height: 38px; border-radius: 10px; margin-bottom: 12px; }
      .cat-name { font-size: 11px; }

      #gallery { padding: 32px 20px 60px; }
      .video-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .v-info { padding: 10px 12px 12px; }
      .v-title { font-size: 12px; }

      .orbit-a { width: 300px; height: 90px; }
      .orbit-b { width: 380px; height: 110px; }
      .platform-glow { width: 200px; }
    }

    @media (max-width: 380px) {
      .video-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <div class="orbit orbit-a"></div>

  <!-- Decorative particles -->
  <div class="particle" style="width:7px;height:7px;top:28%;left:20%;animation-duration:5.2s;animation-delay:0s;"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Stars ── */
(function () {
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let pts = [];

  function resize() {
    c.width = innerWidth; c.height = innerHeight;
    pts = Array.from({ length: 180 }, () => ({
      x: Math.random() * c.width,
      y: Math.random() * c.height,
      r: Math.random() * 1.3 + .15,
      phase: Math.random() * Math.PI * 2,
      speed: .005 + Math.random() * .009,
    }));
  }

  function draw(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    const g = ctx.createRadialGradient(c.width/2, c.height*.4, 0, c.width/2, c.height*.4, c.width*.85);
    g.addColorStop(0, '#0C0E28');
    g.addColorStop(1, '#03060E');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, c.width, c.height);
    pts.forEach(p => {
      const a = Math.abs(Math.sin(p.phase + t * p.speed));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,185,255,${a * .8})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  resize();
  requestAnimationFrame(draw);
  addEventListener('resize', resize);
})();

/* ── Three.js setup ── */
const canvas = document.getElementById('quest-canvas');
const isMob = () => innerWidth <= 640;

function size() { return isMob() ? { w: 290, h: 250 } : { w: 560, h: 440 }; }

const { w, h } = size();
canvas.width = w; canvas.height = h;
canvas.style.width = w + 'px'; canvas.style.height = h + 'px';

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(34, w / h, .1, 100);
cam.position.set(0, .2, 5.6);

const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(w, h);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;

scene.add(new THREE.AmbientLight(0xffffff, .55));

const key = new THREE.DirectionalLight(0xffffff, 2.8);
key.position.set(5, 4, 5); scene.add(key);

const fill = new THREE.DirectionalLight(0xA78BFA, 1.4);
fill.position.set(-4, 1, 3); scene.add(fill);

const rim = new THREE.DirectionalLight(0x60A5FA, .9);
rim.position.set(0, -3, -4); scene.add(rim);

scene.add(Object.assign(new THREE.PointLight(0x7C3AED, 3.5, 12), { position: new THREE.Vector3(-2, 2, 3) }));

const controls = new OrbitControls(cam, canvas);
controls.enableDamping = true;
controls.dampingFactor = .06;
controls.enableZoom = false;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.minPolarAngle = Math.PI * .28;
controls.maxPolarAngle = Math.PI * .62;

new GLTFLoader().load('MetaQuest3D/source/Quest3.glb', gltf => {
  document.getElementById('model-loading').style.display = 'none';
  const m = gltf.scene;
  const box = new THREE.Box3().setFromObject(m);
  const c2 = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3());
  const sc = 2.5 / Math.max(s.x, s.y, s.z);
  m.scale.setScalar(sc);
  m.position.sub(c2.multiplyScalar(sc));
  m.position.y -= .1;
  scene.add(m);
}, undefined, () => { document.getElementById('model-loading').style.display = 'none'; });

(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, cam); })();

addEventListener('resize', () => {
  const s = size();
  canvas.width = s.w; canvas.height = s.h;
  canvas.style.width = s.w + 'px'; canvas.style.height = s.h + 'px';
  cam.aspect = s.w / s.h;
  cam.updateProjectionMatrix();
  renderer.setSize(s.w, s.h);
  if (isMob()) {
    canvas.style.transform = 'translate(-50%, -44%)';
  } else {
    canvas.style.transform = 'translate(-50%, -48%)';
  }
});

/* ── Category Data ── */
const CATS = {
  video360: {
    name: 'Video 360°',
    color: '#8B5CF6',
    videos: [
      { youtubeId: 'XMPqDknaNQk', title: 'BYD 360° Video',        client: 'BYD' },
      { youtubeId: 'pK9IjsLM4UQ', title: 'Geely Visor de Video',  client: 'Geely' },
      { youtubeId: 'HEUyfrkk1Pk', title: 'Accuchek Escenario 360',client: 'Accuchek' },
    ]
  },
  interactivos: {
    name: 'Experiencias Interactivas',
    color: '#3B82F6',
    videos: [
      { youtubeId: 'tL6R2teFwno', title: 'Dueto Box Game', client: 'Dueto' },
      { youtubeId: 'O48hbQlG2e0', title: 'Dropal Rodilla', client: 'Dropal' },
    ]
  },
  mixta: {
    name: 'Realidad Mixta',
    color: '#14B8A6',
    videos: [
      { youtubeId: 'adMGdzjgkV0', title: 'Decorador de Interiores', client: 'EKS' },
      { youtubeId: 'HLu6K-98w2M', title: 'Natura Anchor Elements',  client: 'Natura' },
      { youtubeId: 'XbrtwgM6-lo', title: 'Demo Portales Galápagos', client: 'Claro' },
    ]
  },
  recorridos: {
    name: 'Recorridos Virtuales',
    color: '#F59E0B',
    videos: [
      { youtubeId: 'TgRomgoqdCg', title: 'Dexkedol Recorrido VR',    client: 'Dexkedol' },
      { youtubeId: 'OFkoNrmbDlg', title: 'Dexkedol Explicativo',     client: 'Dexkedol' },
      { youtubeId: 'twuMPHldEVU', title: 'Conoce Ecuador Turístico', client: 'Conoce Ecuador' },
      { youtubeId: 'dnR6FfP7l_Q', title: 'Neurobion Space Launch',   client: 'Neurobion' },
      { youtubeId: 'n5tjLrrI5DE', title: 'Nestlé Nutrition Tren',    client: 'Nestlé' },
      { youtubeId: 'UAXMi6K9aT8', title: 'Nestlé Inducción VR',      client: 'Nestlé' },
      { youtubeId: 'g0t0uLZTIpE', title: 'Purina Recorrido VR',      client: 'Purina' },
      { youtubeId: 'eWk6k6a5-JQ', title: 'Palexxis Tapentadol VR',   client: 'Palexxis' },
      { youtubeId: 'CrZ5SSsvvqc', title: 'Pronobis VR',              client: 'Pronobis' },
      { youtubeId: '6uQXDw_ZwW0', title: 'Huawei VR',                client: 'Huawei' },
    ]
  }
};

let activeCat = null;

window.selectCat = function (id) {
  const cat = CATS[id];
  if (!cat) return;

  /* Update active tab */
  document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
  document.querySelector(`.cat-card[data-cat="${id}"]`).classList.add('active');

  /* Animate grid out then in */
  const grid = document.getElementById('video-grid');
  const gal  = document.getElementById('gallery');

  grid.style.transition = 'opacity .18s, transform .18s';
  grid.style.opacity = '0';
  grid.style.transform = 'translateY(10px)';

  setTimeout(() => {
    document.getElementById('gal-name').textContent = cat.name;
    document.getElementById('gal-name').style.color = cat.color;
    document.getElementById('gal-count').textContent = `· ${cat.videos.length} proyectos`;

    grid.innerHTML = '';
    cat.videos.forEach((v, i) => {
      const card = document.createElement('div');
      card.className = 'v-card';
      card.dataset.cat = id;
      card.style.animationDelay = (i * 45) + 'ms';
      card.innerHTML = `
        <div class="v-thumb">
          <img src="https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg"
               alt="${v.title}" loading="lazy"
               onerror="this.style.opacity='.2'">
          <div class="play-overlay">
            <div class="play-btn">
              <svg viewBox="0 0 24 24" fill="white"><polygon points="6,3 20,12 6,21"/></svg>
            </div>
          </div>
          <span class="client-badge">${v.client}</span>
        </div>
        <div class="v-info">
          <div class="v-title">${v.title}</div>
          <div class="v-meta" style="color:${cat.color}">${cat.name}</div>
        </div>`;
      card.addEventListener('click', () => openModal(v.youtubeId));
      grid.appendChild(card);
    });

    grid.style.transition = 'opacity .28s, transform .28s';
    grid.style.opacity = '1';
    grid.style.transform = 'translateY(0)';

    gal.style.display = 'block';
    if (activeCat === null) {
      setTimeout(() => gal.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
    }
    activeCat = id;
  }, activeCat === null ? 0 : 190);
};

/* ── Modal ── */
window.openModal = function (youtubeId) {
  document.getElementById('modal-iframe').src =
    `https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0`;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
};

window.closeModal = function () {
  document.getElementById('modal-iframe').src = '';
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
};

window.handleModalBg = function (e) {
  if (e.target === document.getElementById('modal')) closeModal();
};

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
