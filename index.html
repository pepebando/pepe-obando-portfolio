<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Projects · José Obando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    :root {
      --bg:        #051424;
      --surface:   #0d1c2d;
      --surface-2: #122131;
      --surface-3: #1c2b3c;
      --text:      #d4e4fa;
      --muted:     #849495;
      --outline:   rgba(58,73,75,.45);
      --outline-c: rgba(0,219,231,.22);

      --cyan:      #00dbe7;
      --cyan-b:    #00f2ff;
      --cyan-dim:  rgba(0,219,231,.12);
      --cyan-glow: 0 0 18px rgba(0,219,231,.32);

      --purple:    #7000ff;
      --purple-b:  #d1bcff;
      --purple-dim:rgba(112,0,255,.12);

      --nav-h: 64px;
      --ease:  cubic-bezier(.4,0,.2,1);
      --mono:  'JetBrains Mono', monospace;
      --sans:  'Sora', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ══════════════════════════════
       HUD NAV
    ══════════════════════════════ */
    #nav {
      position: fixed; inset: 0 0 auto 0;
      z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; height: var(--nav-h);
      background: rgba(5,20,36,.82);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--outline);
    }

    .logo { display:flex; align-items:center; gap:10px; text-decoration:none; flex-shrink:0; }
    .logo-mark {
      font-family: var(--sans); font-size:18px; font-weight:800; letter-spacing:-.02em;
      background: linear-gradient(135deg, var(--cyan-b), var(--purple-b));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .logo-div { width:1px; height:16px; background:var(--outline); }
    .logo-name { font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.05em; }

    .nav-cats { display:flex; gap:2px; }
    .nav-cat {
      position: relative;
      font-family: var(--mono); font-size:11px; font-weight:500;
      letter-spacing:.08em; text-transform:uppercase;
      color: var(--muted); background:none; border:none;
      padding: 8px 14px; cursor:pointer; border-radius:4px;
      transition: color .2s, background .2s;
      white-space: nowrap;
    }
    .nav-cat::after {
      content:''; position:absolute; bottom:0; left:14px; right:14px;
      height:1.5px; background:var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      opacity:0; transition:opacity .2s;
    }
    .nav-cat:hover { color:var(--text); background:rgba(255,255,255,.04); }
    .nav-cat.active { color:var(--cyan); }
    .nav-cat.active::after { opacity:1; }

    .nav-right { display:flex; gap:8px; flex-shrink:0; }
    .nav-icon {
      display:flex; align-items:center; justify-content:center;
      width:36px; height:36px; border-radius:4px;
      border:1px solid var(--outline);
      background:rgba(255,255,255,.03);
      color:var(--muted); text-decoration:none;
      transition: color .2s, border-color .2s, box-shadow .2s, background .2s;
    }
    .nav-icon svg { width:16px; height:16px; }
    .nav-icon:hover {
      color:var(--cyan); border-color:var(--outline-c);
      background:var(--cyan-dim); box-shadow:var(--cyan-glow);
    }

    /* ══════════════════════════════
       PROJECTS
    ══════════════════════════════ */
    #projects {
      position:relative; z-index:2;
      padding: calc(var(--nav-h) + 48px) 64px 80px;
      background:var(--bg);
    }

    .proj-header {
      display:flex; align-items:flex-end; justify-content:space-between;
      margin-bottom:36px; gap:16px;
    }
    .sect-label {
      font-family:var(--mono); font-size:10px; font-weight:500;
      letter-spacing:.18em; text-transform:uppercase;
      color:var(--cyan); margin-bottom:8px;
    }
    .sect-title {
      font-size:clamp(22px,2.8vw,38px); font-weight:700;
      letter-spacing:-.02em; color:var(--text);
    }
    #proj-count {
      font-family:var(--mono); font-size:12px;
      color:var(--muted); letter-spacing:.05em; white-space:nowrap;
    }

    /* Filter tabs */
    .cat-tabs {
      display:flex; gap:6px; margin-bottom:32px;
      padding-bottom:16px; border-bottom:1px solid var(--outline);
      overflow-x:auto; scrollbar-width:none;
    }
    .cat-tabs::-webkit-scrollbar { display:none; }

    .cat-tab {
      display:flex; align-items:center; gap:7px;
      padding:7px 14px; border-radius:4px;
      border:1px solid transparent; background:none;
      font-family:var(--mono); font-size:11px; font-weight:500;
      letter-spacing:.08em; text-transform:uppercase;
      color:var(--muted); cursor:pointer; flex-shrink:0;
      transition: all .22s var(--ease);
    }
    .cat-tab .dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }
    .cat-tab:hover { color:var(--text); background:rgba(255,255,255,.04); border-color:var(--outline); }
    .cat-tab.active {
      color:var(--cyan); background:var(--cyan-dim);
      border-color:var(--outline-c); box-shadow:var(--cyan-glow);
    }

    /* Grid */
    .video-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:16px;
    }

    @keyframes cardIn {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .v-card {
      border-radius:8px; overflow:hidden;
      background:var(--surface); border:1px solid var(--outline);
      cursor:pointer; position:relative;
      transition: transform .25s var(--ease), border-color .25s, box-shadow .25s;
      animation:cardIn .35s var(--ease) backwards;
    }
    .v-card::before {
      content:''; position:absolute; inset:0; border-radius:8px;
      background:linear-gradient(135deg,var(--cyan-dim),var(--purple-dim));
      opacity:0; transition:opacity .3s; pointer-events:none; z-index:0;
    }
    .v-card:hover { transform:translateY(-6px); border-color:var(--outline-c); box-shadow:0 0 24px rgba(0,219,231,.14), 0 20px 40px rgba(0,0,0,.4); }
    .v-card:hover::before { opacity:1; }

    .v-thumb {
      position:relative; width:100%; aspect-ratio:16/9;
      overflow:hidden; background:var(--surface-2);
    }
    .v-thumb img {
      width:100%; height:100%; object-fit:cover; display:block;
      filter:brightness(.72) saturate(.85);
      transition:transform .5s var(--ease), filter .4s;
    }
    /* scanlines */
    .v-thumb::after {
      content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
      background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.05) 3px,rgba(0,0,0,.05) 4px);
    }
    .v-card:hover .v-thumb img { transform:scale(1.06); filter:brightness(.95) saturate(1.1); }

    .play-overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:2; }
    .play-btn {
      width:48px; height:48px; border-radius:50%;
      background:rgba(0,0,0,.5); border:1.5px solid rgba(0,219,231,.55);
      display:flex; align-items:center; justify-content:center;
      backdrop-filter:blur(6px);
      transition:transform .2s, box-shadow .2s, background .2s;
    }
    .play-btn svg { width:18px; height:18px; margin-left:2px; }
    .v-card:hover .play-btn { transform:scale(1.12); background:rgba(0,219,231,.15); box-shadow:0 0 22px rgba(0,219,231,.45); }

    .client-badge {
      position:absolute; top:10px; right:10px; z-index:3;
      padding:3px 9px; border-radius:2px;
      background:rgba(5,20,36,.75); backdrop-filter:blur(8px);
      font-family:var(--mono); font-size:9px; font-weight:500;
      color:var(--cyan); letter-spacing:.1em; text-transform:uppercase;
      border:1px solid var(--outline-c);
    }

    .v-info { padding:14px 16px 16px; position:relative; z-index:1; }
    .v-by {
      font-family:var(--mono); font-size:9px; font-weight:500;
      letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:4px;
    }
    .v-title {
      font-size:14px; font-weight:600; line-height:1.35; color:var(--text);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:4px;
    }
    .v-meta { font-family:var(--mono); font-size:10px; font-weight:400; letter-spacing:.04em; }

    /* ══════════════════════════════
       CLIENTS / LOGOS
    ══════════════════════════════ */
    #clients {
      position:relative; z-index:2;
      padding:64px 64px;
      background:var(--surface);
      border-top:1px solid var(--outline);
      border-bottom:1px solid var(--outline);
    }

    .clients-label {
      font-family:var(--mono); font-size:10px; font-weight:500;
      letter-spacing:.22em; text-transform:uppercase;
      color:var(--muted); text-align:center; margin-bottom:44px;
    }

    .logos-grid {
      display:flex; flex-wrap:wrap;
      justify-content:center; align-items:center;
      gap:36px 52px;
    }

    .logo-item { height:28px; display:flex; align-items:center; }
    .logo-item img {
      height:100%; width:auto; max-width:110px; object-fit:contain;
      filter:brightness(0) invert(1); opacity:.4;
      transition:opacity .25s;
    }
    .logo-item:hover img { opacity:.8; }

    /* ══════════════════════════════
       FOOTER
    ══════════════════════════════ */
    footer {
      position:relative; z-index:2;
      padding:36px 64px;
      display:flex; align-items:center; justify-content:space-between;
      border-top:1px solid var(--outline); background:var(--bg);
      gap:24px;
    }

    .footer-left { display:flex; flex-direction:column; gap:6px; }
    .footer-tag { font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.04em; }

    .footer-links { display:flex; gap:24px; }
    .footer-link {
      font-family:var(--mono); font-size:11px; color:var(--muted);
      text-decoration:none; letter-spacing:.04em; transition:color .2s;
    }
    .footer-link:hover { color:var(--cyan); }

    /* ══════════════════════════════
       MODAL
    ══════════════════════════════ */
    #modal {
      display:none; position:fixed; inset:0; z-index:500;
      background:rgba(1,15,31,.96); backdrop-filter:blur(16px);
      align-items:center; justify-content:center; padding:24px;
    }
    #modal.open { display:flex; }

    .modal-inner { position:relative; width:100%; max-width:960px; }
    .modal-close {
      position:absolute; top:-48px; right:0;
      display:flex; align-items:center; gap:6px;
      background:none; border:none; font-family:var(--mono);
      font-size:11px; font-weight:500; letter-spacing:.08em;
      color:var(--muted); cursor:pointer; transition:color .2s;
    }
    .modal-close svg { width:14px; height:14px; }
    .modal-close:hover { color:var(--cyan); }

    .modal-frame {
      width:100%; aspect-ratio:16/9; border-radius:8px;
      overflow:hidden; background:#000;
      box-shadow:0 0 60px rgba(0,219,231,.12), 0 40px 80px rgba(0,0,0,.7);
      border:1px solid var(--outline-c);
    }
    .modal-frame iframe { width:100%; height:100%; display:block; border:none; }

    /* ══════════════════════════════
       MOBILE
    ══════════════════════════════ */
    @media (max-width:768px) {
      #nav { padding:0 20px; }
      .nav-cats { display:none; }
      .logo-name { display:none; }

      #projects { padding: calc(var(--nav-h) + 24px) 20px 64px; }
      #clients   { padding:48px 20px; }
      footer     { padding:32px 20px; flex-direction:column; align-items:flex-start; }

      .video-grid { grid-template-columns:1fr 1fr; gap:10px; }
      .logos-grid { gap:24px 32px; }
      .logo-item  { height:22px; }
    }

    @media (max-width:480px) {
      .video-grid { grid-template-columns:1fr; }
    }
  </style>
</head>

<script>
/* Data */
const CATS = {
  video360:    { name:'Video 360°',               color:'#00dbe7', videos:[
    {youtubeId:'XMPqDknaNQk', title:'BYD 360° Video',         client:'BYD'},
    {youtubeId:'pK9IjsLM4UQ', title:'Geely Visor de Video',   client:'Geely'},
    {youtubeId:'HEUyfrkk1Pk', title:'Accuchek Escenario 360', client:'Accuchek'},
    {youtubeId:'CrZ5SSsvvqc', title:'Pronobis VR',            client:'Pronobis'},
    {youtubeId:'6uQXDw_ZwW0', title:'Huawei VR',              client:'Huawei'},
  ]},
  interactivos:{ name:'Experiencias Interactivas', color:'#d1bcff', videos:[
    {youtubeId:'tL6R2teFwno', title:'Dueto Box Game', client:'Dueto'},
    {youtubeId:'O48hbQlG2e0', title:'Dropal Rodilla',  client:'Dropal'},
  ]},
  mixta:       { name:'Realidad Mixta',            color:'#5eead4', videos:[
    {youtubeId:'adMGdzjgkV0', title:'Decorador de Interiores',  client:'EKS'},
    {youtubeId:'HLu6K-98w2M', title:'Natura Anchor Elements',   client:'Natura'},
    {youtubeId:'XbrtwgM6-lo', title:'Demo Portales Galápagos',  client:'Claro'},
  ]},
  recorridos:  { name:'Recorridos Virtuales',      color:'#a78bfa', videos:[
    {youtubeId:'TgRomgoqdCg', title:'Dexkedol Recorrido VR',    client:'Dexkedol'},
    {youtubeId:'twuMPHldEVU', title:'Conoce Ecuador Turístico', client:'Conoce Ecuador'},
    {youtubeId:'dnR6FfP7l_Q', title:'Neurobion Space Launch',   client:'Neurobion'},
    {youtubeId:'n5tjLrrI5DE', title:'Nestlé Nutrition Tren',    client:'Nestlé'},
    {youtubeId:'UAXMi6K9aT8', title:'Nestlé Inducción VR',      client:'Nestlé'},
    {youtubeId:'g0t0uLZTIpE', title:'Purina Recorrido VR',      client:'Purina'},
    {youtubeId:'eWk6k6a5-JQ', title:'Palexxis Tapentadol VR',   client:'Palexxis'},
  ]},
};

function buildGrid(catId){
  const grid = document.getElementById('video-grid');
  grid.innerHTML = '';
  const all = [];
  if(catId==='all'){
    Object.entries(CATS).forEach(([id,cat])=>cat.videos.forEach(v=>all.push({...v,catId:id,catName:cat.name,catColor:cat.color})));
  } else {
    const cat=CATS[catId]; if(!cat) return;
    cat.videos.forEach(v=>all.push({...v,catId,catName:cat.name,catColor:cat.color}));
  }
  document.getElementById('proj-count').textContent=`${all.length} proyectos`;
  all.forEach((v,i)=>{
    const card=document.createElement('div');
    card.className='v-card';
    card.style.animationDelay=(i*35)+'ms';
    card.innerHTML=`
      <div class="v-thumb">
        <img src="https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg"
             alt="${v.title}" loading="lazy" onerror="this.style.opacity='.08'">
        <div class="play-overlay">
          <div class="play-btn">
            <svg viewBox="0 0 24 24" fill="white"><polygon points="6,3 20,12 6,21"/></svg>
          </div>
        </div>
        <span class="client-badge">${v.client}</span>
      </div>
      <div class="v-info">
        <div class="v-by">Project by · ${v.client}</div>
        <div class="v-title">${v.title}</div>
        <div class="v-meta" style="color:${v.catColor}">${v.catName}</div>
      </div>`;
    card.addEventListener('click',()=>openModal(v.youtubeId));
    grid.appendChild(card);
  });
}

window.filterTo = function(catId, btn){
  document.querySelectorAll('.cat-tab,.nav-cat').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const navBtn=document.querySelector(`.nav-cat[data-cat="${catId}"]`);
  if(navBtn) navBtn.classList.add('active');
  const tabBtn=document.querySelector(`.cat-tab[data-cat="${catId}"]`);
  if(tabBtn) tabBtn.classList.add('active');
  buildGrid(catId);
};

window.openModal = function(youtubeId){
  document.getElementById('modal-iframe').src=`https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0`;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
};
window.closeModal = function(){
  document.getElementById('modal-iframe').src='';
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
};
window.handleModalBg = e=>{ if(e.target===document.getElementById('modal')) closeModal(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

buildGrid('all');
</script>
</body>
</html>
