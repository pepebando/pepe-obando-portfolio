<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Projects · José Obando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    :root {
      --bg:       #05090F;
      --surface:  #0B1220;
      --surface2: #111C2E;
      --border:   rgba(255,255,255,0.07);
      --text:     #E8EEFF;
      --muted:    #5C6D88;
      --dim:      #2A3A52;
      --nav-h:    64px;
      --ease:     cubic-bezier(.4,0,.2,1);

      --c360: #8B5CF6;
      --cint: #3B82F6;
      --cmix: #14B8A6;
      --crec: #F59E0B;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      overflow: hidden; /* hero fills viewport */
      -webkit-font-smoothing: antialiased;
    }

    /* ── Stars ── */
    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ═══════════════════════════
       NAV
    ═══════════════════════════ */
    #nav {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: var(--nav-h);
      background: rgba(5,9,15,.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-mark {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -.5px;
      background: linear-gradient(135deg, #A78BFA, #60A5FA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-div { width: 1px; height: 16px; background: var(--dim); }

    .logo-name {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
    }

    .nav-contact { display: flex; gap: 6px; }

    .nav-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.03);
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      transition: color .2s, border-color .2s, background .2s;
      white-space: nowrap;
    }

    .nav-pill svg { width: 13px; height: 13px; flex-shrink: 0; }
    .nav-pill:hover { color: var(--text); border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.06); }

    /* ═══════════════════════════
       HERO  (flex: sidebar + main)
    ═══════════════════════════ */
    #hero {
      position: fixed;        /* fills viewport under nav */
      inset: var(--nav-h) 0 0 0;
      display: flex;
      z-index: 1;
      overflow: hidden;
    }

    /* ── decorative background (behind sidebar + main) ── */
    .hero-glow {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 700px; height: 500px;
      background: radial-gradient(ellipse, rgba(109,40,217,.15) 0%, rgba(59,130,246,.06) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .orbit {
      position: absolute;
      top: 50%; left: 55%;   /* offset right for sidebar */
      border-radius: 50%;
      border: 1px solid rgba(139,92,246,.10);
      pointer-events: none;
      z-index: 0;
    }
    .orbit-a { width: 500px; height: 140px; transform: translate(-50%,-50%); margin-top: 30px; }
    .orbit-b { width: 660px; height: 180px; transform: translate(-50%,-50%); margin-top: 45px; border-color: rgba(96,165,250,.06); }

    .platform-glow {
      position: absolute;
      bottom: 30%; left: 55%;
      transform: translateX(-50%);
      width: 280px; height: 20px;
      background: radial-gradient(ellipse, rgba(109,40,217,.5) 0%, transparent 70%);
      filter: blur(8px);
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(167,139,250,.7), transparent 70%);
      pointer-events: none;
      animation: particleFloat linear infinite;
      z-index: 0;
    }
    @keyframes particleFloat {
      0%,100% { transform: translateY(0); opacity: .6; }
      50%      { transform: translateY(-14px); opacity: 1; }
    }

    /* ══════════════════════════
       SIDEBAR
    ══════════════════════════ */
    #cat-sidebar {
      width: 210px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 24px 12px 20px;
      border-right: 1px solid var(--border);
      background: rgba(5,9,15,.65);
      backdrop-filter: blur(20px);
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 10;
      position: relative;
    }
    #cat-sidebar::-webkit-scrollbar { display: none; }

    .sidebar-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 6px;
      margin-bottom: 2px;
    }

    /* ── Category cards ── */
    .cat-card {
      position: relative;
      padding: 16px 14px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: rgba(255,255,255,.02);
      cursor: pointer;
      transition: transform .22s var(--ease), border-color .22s, box-shadow .22s, background .22s;
      overflow: hidden;
      user-select: none;
      flex-shrink: 0;
    }

    .cat-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0;
      transition: opacity .3s;
    }

    .cat-card[data-cat="video360"]::before    { background: radial-gradient(circle at 25% 25%, rgba(139,92,246,.3), transparent 65%); }
    .cat-card[data-cat="interactivos"]::before { background: radial-gradient(circle at 25% 25%, rgba(59,130,246,.3), transparent 65%); }
    .cat-card[data-cat="mixta"]::before        { background: radial-gradient(circle at 25% 25%, rgba(20,184,166,.3), transparent 65%); }
    .cat-card[data-cat="recorridos"]::before   { background: radial-gradient(circle at 25% 25%, rgba(245,158,11,.3), transparent 65%); }

    .cat-card:hover { transform: translateX(3px); }
    .cat-card:hover::before { opacity: .55; }

    .cat-card.active { transform: translateX(4px); }
    .cat-card.active::before { opacity: 1; }

    .cat-card[data-cat="video360"].active    { border-color: rgba(139,92,246,.55);  box-shadow: 0 0 22px rgba(139,92,246,.16); }
    .cat-card[data-cat="interactivos"].active { border-color: rgba(59,130,246,.55);  box-shadow: 0 0 22px rgba(59,130,246,.16); }
    .cat-card[data-cat="mixta"].active        { border-color: rgba(20,184,166,.55);  box-shadow: 0 0 22px rgba(20,184,166,.16); }
    .cat-card[data-cat="recorridos"].active   { border-color: rgba(245,158,11,.55);  box-shadow: 0 0 22px rgba(245,158,11,.16); }

    .cat-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px;
      position: relative; z-index: 1;
    }
    .cat-icon svg { width: 18px; height: 18px; }

    .cat-card[data-cat="video360"] .cat-icon    { background: rgba(139,92,246,.15); color: #A78BFA; }
    .cat-card[data-cat="interactivos"] .cat-icon { background: rgba(59,130,246,.15); color: #93C5FD; }
    .cat-card[data-cat="mixta"] .cat-icon        { background: rgba(20,184,166,.15); color: #5EEAD4; }
    .cat-card[data-cat="recorridos"] .cat-icon   { background: rgba(245,158,11,.15); color: #FCD34D; }

    .cat-name {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .4px;
      line-height: 1.3;
      position: relative; z-index: 1;
      margin-bottom: 4px;
    }
    .cat-card[data-cat="video360"] .cat-name    { color: #C4B5FD; }
    .cat-card[data-cat="interactivos"] .cat-name { color: #BAE6FD; }
    .cat-card[data-cat="mixta"] .cat-name        { color: #99F6E4; }
    .cat-card[data-cat="recorridos"] .cat-name   { color: #FDE68A; }

    .cat-count {
      font-size: 11px;
      color: var(--muted);
      position: relative; z-index: 1;
    }

    .cat-bar {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 2px;
      border-radius: 14px 0 0 14px;
      transform: scaleY(0);
      transition: transform .3s var(--ease);
    }
    .cat-card[data-cat="video360"] .cat-bar    { background: #8B5CF6; }
    .cat-card[data-cat="interactivos"] .cat-bar { background: #3B82F6; }
    .cat-card[data-cat="mixta"] .cat-bar        { background: #14B8A6; }
    .cat-card[data-cat="recorridos"] .cat-bar   { background: #F59E0B; }
    .cat-card.active .cat-bar { transform: scaleY(1); }

    /* ══════════════════════════
       HERO MAIN  (model ↔ grid)
    ══════════════════════════ */
    #hero-main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* ── Model view ── */
    #model-area {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .3s var(--ease), transform .3s var(--ease);
    }
    #model-area.hidden {
      opacity: 0;
      transform: scale(.97);
      pointer-events: none;
    }

    .hero-title {
      position: absolute;
      top: 12%;
      left: 50%; transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      width: 85%;
      z-index: 5;
    }
    .hero-title h1 {
      font-size: clamp(22px, 3.2vw, 44px);
      font-weight: 800;
      letter-spacing: -.5px;
      line-height: 1.1;
      background: linear-gradient(150deg, #fff 0%, rgba(167,139,250,.85) 55%, rgba(96,165,250,.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-title p {
      margin-top: 8px;
      font-size: clamp(12px, 1.2vw, 14px);
      color: var(--muted);
    }

    #model-loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -52%);
      width: 56px; height: 56px;
      border: 2px solid rgba(139,92,246,.2);
      border-top-color: #A78BFA;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      z-index: 3;
    }
    @keyframes spin { to { transform: translate(-50%,-52%) rotate(360deg); } }

    #quest-canvas {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -52%);
      z-index: 2;
    }

    .scroll-indicator {
      position: absolute;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      animation: fadeDown 2s ease-in-out infinite;
    }
    .scroll-indicator .si-line {
      width: 1px; height: 28px;
      background: linear-gradient(to bottom, transparent, var(--muted));
    }
    @keyframes fadeDown {
      0%,100% { opacity: .35; transform: translateX(-50%) translateY(0); }
      50%      { opacity: .8;  transform: translateX(-50%) translateY(5px); }
    }

    /* ── Gallery overlay (within hero-main) ── */
    #gallery {
      position: absolute;
      inset: 0;
      padding: 24px 28px 20px;
      overflow-y: auto;
      overflow-x: hidden;
      background: rgba(5,9,15,.86);
      backdrop-filter: blur(14px);
      opacity: 0;
      transform: translateX(16px);
      pointer-events: none;
      transition: opacity .28s var(--ease), transform .28s var(--ease);
      scrollbar-width: thin;
      scrollbar-color: var(--dim) transparent;
      z-index: 5;
    }
    #gallery::-webkit-scrollbar { width: 4px; }
    #gallery::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

    #gallery.visible {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .gal-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 100px;
      cursor: pointer;
      transition: color .2s, background .2s;
      font-family: inherit;
      flex-shrink: 0;
    }
    .back-btn svg { width: 13px; height: 13px; }
    .back-btn:hover { color: var(--text); background: rgba(255,255,255,.1); }

    .gal-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -.1px;
    }

    .gal-count {
      font-size: 12px;
      color: var(--muted);
      margin-left: auto;
      flex-shrink: 0;
    }

    /* ── Video Grid ── */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .v-card {
      border-radius: 14px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform .25s var(--ease), border-color .25s, box-shadow .25s;
      animation: cardIn .35s var(--ease) backwards;
    }
    .v-card:hover { transform: translateY(-5px); }

    .v-card[data-cat="video360"]:hover    { border-color: rgba(139,92,246,.4); box-shadow: 0 14px 36px rgba(139,92,246,.14); }
    .v-card[data-cat="interactivos"]:hover { border-color: rgba(59,130,246,.4);  box-shadow: 0 14px 36px rgba(59,130,246,.14); }
    .v-card[data-cat="mixta"]:hover        { border-color: rgba(20,184,166,.4);  box-shadow: 0 14px 36px rgba(20,184,166,.14); }
    .v-card[data-cat="recorridos"]:hover   { border-color: rgba(245,158,11,.4);  box-shadow: 0 14px 36px rgba(245,158,11,.14); }

    .v-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: var(--surface2);
    }
    .v-thumb img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform .4s var(--ease), filter .4s;
      filter: brightness(.82);
    }
    .v-card:hover .v-thumb img { transform: scale(1.05); filter: brightness(1); }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .play-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      border: 1.5px solid rgba(255,255,255,.6);
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
      transition: transform .2s, background .2s;
    }
    .play-btn svg { width: 17px; height: 17px; margin-left: 2px; }
    .v-card:hover .play-btn { transform: scale(1.1); background: rgba(0,0,0,.72); }

    .client-badge {
      position: absolute;
      top: 8px; right: 8px;
      padding: 2px 9px;
      border-radius: 100px;
      background: rgba(0,0,0,.62);
      backdrop-filter: blur(6px);
      font-size: 9px;
      font-weight: 600;
      color: rgba(255,255,255,.75);
      letter-spacing: .3px;
      border: 1px solid rgba(255,255,255,.1);
    }

    .v-info { padding: 11px 13px 13px; }
    .v-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .v-meta { font-size: 10.5px; color: var(--muted); font-weight: 500; }

    /* ═══════════════════════════
       MODAL
    ═══════════════════════════ */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(3,6,15,.94);
      backdrop-filter: blur(14px);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #modal.open { display: flex; }

    .modal-inner { position: relative; width: 100%; max-width: 960px; }

    .modal-close {
      position: absolute;
      top: -46px; right: 0;
      display: flex; align-items: center; gap: 5px;
      background: none; border: none;
      color: var(--muted); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: color .2s; font-family: inherit;
    }
    .modal-close svg { width: 14px; height: 14px; }
    .modal-close:hover { color: var(--text); }

    .modal-frame {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 40px 80px rgba(0,0,0,.6);
    }
    .modal-frame iframe { width: 100%; height: 100%; display: block; border: none; }

    /* ═══════════════════════════
       MOBILE  (≤768px)
    ═══════════════════════════ */
    @media (max-width: 768px) {
      body { overflow: auto; }  /* re-enable scroll on mobile */

      #nav { padding: 0 16px; }
      .nav-pill span { display: none; }
      .logo-name { display: none; }

      /* Stack vertically on mobile */
      #hero {
        position: relative;
        inset: auto;
        margin-top: var(--nav-h);
        flex-direction: column;
        height: auto;
        min-height: calc(100svh - var(--nav-h));
      }

      /* Model at top */
      #hero-main {
        height: 52vw;
        min-height: 260px;
        max-height: 380px;
        flex: none;
        order: 1;
      }

      #quest-canvas {
        width: 280px !important;
        height: 230px !important;
        transform: translate(-50%,-50%) !important;
      }

      #model-loading {
        transform: translate(-50%,-50%) rotate(0) !important;
      }

      .orbit-a { width: 260px; height: 80px; left: 50%; }
      .orbit-b { width: 340px; height: 100px; left: 50%; }
      .platform-glow { left: 50%; }

      .hero-title { top: 10%; }
      .hero-title h1 { font-size: 20px; }

      .scroll-indicator { display: none; }

      /* Sidebar becomes 2×2 grid below model */
      #cat-sidebar {
        width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px;
        padding: 14px;
        border-right: none;
        border-top: 1px solid var(--border);
        order: 2;
      }

      .sidebar-label { width: 100%; margin-bottom: 0; }

      .cat-card {
        flex: 1 1 calc(50% - 4px);
        min-width: 0;
        transform: none !important; /* disable slide-right on mobile */
      }

      /* On mobile the gallery overlays hero-main */
      #gallery { padding: 16px; }
      .video-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .v-title { font-size: 11px; }
      .gal-title { font-size: 14px; }
    }

    @media (max-width: 400px) {
      .video-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Stars ── */
(function () {
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let pts = [];
  function resize() {
    c.width = innerWidth; c.height = innerHeight;
    pts = Array.from({ length: 180 }, () => ({
      x: Math.random() * c.width, y: Math.random() * c.height,
      r: Math.random() * 1.3 + .15,
      phase: Math.random() * Math.PI * 2,
      speed: .005 + Math.random() * .009,
    }));
  }
  function draw(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    const g = ctx.createRadialGradient(c.width * .6, c.height * .45, 0, c.width * .6, c.height * .45, c.width * .8);
    g.addColorStop(0, '#0C0E28'); g.addColorStop(1, '#03060E');
    ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
    pts.forEach(p => {
      const a = Math.abs(Math.sin(p.phase + t * p.speed));
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,185,255,${a * .8})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  resize(); requestAnimationFrame(draw);
  addEventListener('resize', resize);
})();

/* ── Three.js ── */
const canvas = document.getElementById('quest-canvas');
const isMob = () => innerWidth <= 768;

function getSize() { return isMob() ? { w: 280, h: 230 } : { w: 520, h: 420 }; }

const { w, h } = getSize();
canvas.width = w; canvas.height = h;
canvas.style.width = w + 'px'; canvas.style.height = h + 'px';

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(34, w / h, .1, 100);
cam.position.set(0, .2, 5.6);

const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(w, h);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;

scene.add(new THREE.AmbientLight(0xffffff, .55));

const key = new THREE.DirectionalLight(0xffffff, 2.8);
key.position.set(5, 4, 5); scene.add(key);

const fill = new THREE.DirectionalLight(0xA78BFA, 1.4);
fill.position.set(-4, 1, 3); scene.add(fill);

const rim = new THREE.DirectionalLight(0x60A5FA, .9);
rim.position.set(0, -3, -4); scene.add(rim);

const pLight = new THREE.PointLight(0x7C3AED, 3.5, 12);
pLight.position.set(-2, 2, 3); scene.add(pLight);

const controls = new OrbitControls(cam, canvas);
controls.enableDamping = true; controls.dampingFactor = .06;
controls.enableZoom = false; controls.enablePan = false;
controls.autoRotate = true; controls.autoRotateSpeed = 1.0;
controls.minPolarAngle = Math.PI * .28; controls.maxPolarAngle = Math.PI * .62;

new GLTFLoader().load('MetaQuest3D/source/Quest3.glb', gltf => {
  document.getElementById('model-loading').style.display = 'none';
  const m = gltf.scene;
  const box = new THREE.Box3().setFromObject(m);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const sc = 2.5 / Math.max(size.x, size.y, size.z);
  m.scale.setScalar(sc);
  m.position.sub(center.multiplyScalar(sc));
  m.position.y -= .1;
  scene.add(m);
}, undefined, () => { document.getElementById('model-loading').style.display = 'none'; });

(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, cam); })();

addEventListener('resize', () => {
  const s = getSize();
  canvas.width = s.w; canvas.height = s.h;
  canvas.style.width = s.w + 'px'; canvas.style.height = s.h + 'px';
  cam.aspect = s.w / s.h; cam.updateProjectionMatrix();
  renderer.setSize(s.w, s.h);
});

/* ── Data ── */
const CATS = {
  video360: {
    name: 'Video 360°', color: '#8B5CF6',
    videos: [
      { youtubeId: 'XMPqDknaNQk', title: 'BYD 360° Video',        client: 'BYD' },
      { youtubeId: 'pK9IjsLM4UQ', title: 'Geely Visor de Video',  client: 'Geely' },
      { youtubeId: 'HEUyfrkk1Pk', title: 'Accuchek Escenario 360',client: 'Accuchek' },
      { youtubeId: 'CrZ5SSsvvqc', title: 'Pronobis VR',           client: 'Pronobis' },
      { youtubeId: '6uQXDw_ZwW0', title: 'Huawei VR',             client: 'Huawei' },
    ]
  },
  interactivos: {
    name: 'Experiencias Interactivas', color: '#3B82F6',
    videos: [
      { youtubeId: 'tL6R2teFwno', title: 'Dueto Box Game', client: 'Dueto' },
      { youtubeId: 'O48hbQlG2e0', title: 'Dropal Rodilla', client: 'Dropal' },
    ]
  },
  mixta: {
    name: 'Realidad Mixta', color: '#14B8A6',
    videos: [
      { youtubeId: 'adMGdzjgkV0', title: 'Decorador de Interiores', client: 'EKS' },
      { youtubeId: 'HLu6K-98w2M', title: 'Natura Anchor Elements',  client: 'Natura' },
      { youtubeId: 'XbrtwgM6-lo', title: 'Demo Portales Galápagos', client: 'Claro' },
    ]
  },
  recorridos: {
    name: 'Recorridos Virtuales', color: '#F59E0B',
    videos: [
      { youtubeId: 'TgRomgoqdCg', title: 'Dexkedol Recorrido VR',    client: 'Dexkedol' },
      { youtubeId: 'twuMPHldEVU', title: 'Conoce Ecuador Turístico', client: 'Conoce Ecuador' },
      { youtubeId: 'dnR6FfP7l_Q', title: 'Neurobion Space Launch',   client: 'Neurobion' },
      { youtubeId: 'n5tjLrrI5DE', title: 'Nestlé Nutrition Tren',    client: 'Nestlé' },
      { youtubeId: 'UAXMi6K9aT8', title: 'Nestlé Inducción VR',      client: 'Nestlé' },
      { youtubeId: 'g0t0uLZTIpE', title: 'Purina Recorrido VR',      client: 'Purina' },
      { youtubeId: 'eWk6k6a5-JQ', title: 'Palexxis Tapentadol VR',   client: 'Palexxis' },
    ]
  }
};

let activeCat = null;

/* ── Select category → show gallery over model ── */
window.selectCat = function (id) {
  const cat = CATS[id];
  if (!cat) return;

  // Toggle: click active again → close
  if (activeCat === id) { closeGallery(); return; }

  // Mark active sidebar card
  document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
  document.querySelector(`.cat-card[data-cat="${id}"]`).classList.add('active');

  // Build grid
  const grid = document.getElementById('video-grid');
  grid.innerHTML = '';
  cat.videos.forEach((v, i) => {
    const card = document.createElement('div');
    card.className = 'v-card';
    card.dataset.cat = id;
    card.style.animationDelay = (i * 40) + 'ms';
    card.innerHTML = `
      <div class="v-thumb">
        <img src="https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg"
             alt="${v.title}" loading="lazy" onerror="this.style.opacity='.15'">
        <div class="play-overlay">
          <div class="play-btn">
            <svg viewBox="0 0 24 24" fill="white"><polygon points="6,3 20,12 6,21"/></svg>
          </div>
        </div>
        <span class="client-badge">${v.client}</span>
      </div>
      <div class="v-info">
        <div class="v-title">${v.title}</div>
        <div class="v-meta" style="color:${cat.color}">${cat.name}</div>
      </div>`;
    card.addEventListener('click', () => openModal(v.youtubeId));
    grid.appendChild(card);
  });

  // Update header
  document.getElementById('gal-title').textContent = cat.name;
  document.getElementById('gal-title').style.color = cat.color;
  document.getElementById('gal-count').textContent = `${cat.videos.length} proyectos`;

  // Transition: hide model, show gallery
  document.getElementById('model-area').classList.add('hidden');
  const gal = document.getElementById('gallery');
  gal.scrollTop = 0;
  gal.classList.add('visible');

  activeCat = id;
};

/* ── Back to model ── */
window.closeGallery = function () {
  document.getElementById('gallery').classList.remove('visible');
  document.getElementById('model-area').classList.remove('hidden');
  document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
  activeCat = null;
};

/* ── Modal ── */
window.openModal = function (youtubeId) {
  document.getElementById('modal-iframe').src =
    `https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0`;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
};

window.closeModal = function () {
  document.getElementById('modal-iframe').src = '';
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
};

window.handleModalBg = e => {
  if (e.target === document.getElementById('modal')) closeModal();
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); }
});
</script>
